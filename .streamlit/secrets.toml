# Streamlit Cloud Secrets — 自动注入为环境变量
# push 后 Streamlit Cloud 自动读取，无需手动在 Web UI 配置
# 文档: https://docs.streamlit.io/deploy/streamlit-community-cloud/deploy-your-app/secrets-management

# ---- PushPlus 微信推送 ----
PUSHPLUS_TOKEN = "fe1ca2d18ccd47d1b7c62d58bd1baca4"
PUSHPLUS_TOPIC = ""
LOCATION = "钦州监测点"

# ---- 演示登录 ----
API_KEY = "rockfall2024"

# ---- 检测参数 ----
DETECTION_CONFIDENCE = "0.10"
MOTION_MIN_AREA = "50"
ALERT_COOLDOWN_SECONDS = "10"

# ---- 四级预警阈值 ----
ALERT_BLUE_CONFIDENCE_LOW = "0.10"
ALERT_BLUE_CONFIDENCE_HIGH = "0.20"
ALERT_YELLOW_CONFIDENCE_HIGH = "0.40"
ALERT_ORANGE_CONFIDENCE_HIGH = "0.70"

# ═══════════════════════════════════════
# 误报抑制模块 (经 A/B 测试验证)
# ═══════════════════════════════════════

# MOG2 中心点运动滤波
MOG2_FILTER_ENABLED = "true"
MOG2_RELAX_RADIUS = "8"
MOG2_RELAX_FG_THRESHOLD = "0.03"
MOG2_DETECT_SHADOWS = "true"

# 三帧差分 (对小落石无效，关闭)
TFD_ENABLED = "false"

# 几何误报过滤
GEO_FILTER_ENABLED = "true"
GEO_FILTER_ASPECT_MIN = "0.3"
GEO_FILTER_ASPECT_MAX = "3.0"
GEO_FILTER_AREA_MIN = "25"

# 场景干扰抑制 (天空检测)
SCENE_FILTER_ENABLED = "true"

# 概率融合
FUSION_ENABLED = "true"
FUSION_MOTION_WEIGHT = "0.50"

# 多帧时序确认
TEMPORAL_ENABLED = "true"
TEMPORAL_WINDOW = "2"
TEMPORAL_IOU = "0.20"

# Sobel 边缘增强
EDGE_ENHANCE_ENABLED = "true"
EDGE_ENHANCE_ALPHA = "0.3"
EDGE_ENHANCE_INTERVAL = "1"

# ---- 性能优化 ----
ROI_CROP_ENABLED = "true"

# ---- 前兆升压 ----
PRECURSOR_ESCALATION_ENABLED = "true"
PRECURSOR_ESCALATION_PERSIST_SEC = "15"
PRECURSOR_ESCALATION_RED_SEC = "30"
PRECURSOR_ESCALATION_DECAY_RATE = "0.3"

# ---- 自适应跳帧 ----
SKIP_IDLE = "5"
SKIP_ACTIVE = "5"
SKIP_CRITICAL = "2"

# ---- MOG2 背景建模 ----
MOG2_HISTORY = "500"
MOG2_VAR_THRESHOLD = "32"
MOG2_LEARNING_RATE = "0.001"
MOG2_MORPH_KERNEL = "5"
MOG2_RESET_IDLE_FRAMES = "100"

# ---- 深度空闲降频 ----
DEEP_IDLE_ENABLED = "true"
DEEP_IDLE_TIMEOUT_SEC = "600"
DEEP_IDLE_INFERENCE_INTERVAL_SEC = "10.0"
DEEP_IDLE_WAKE_UP_DEBOUNCE = "3"

# ---- SORT 跟踪 ----
TRACK_MIN_CONFIRM = "3"
TRACK_IOU_THRESHOLD = "0.3"

# ---- 缩略图 ----
THUMBNAIL_ENABLED = "true"
THUMBNAIL_SAVE_INTERVAL_MIN = "10"
